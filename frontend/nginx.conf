server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;   # DNS interno do Docker

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;                  # a variável força resolução a cada requisição
        proxy_set_header Host $http_host;     # Location do 201 aponta para localhost:3000
    }

    location / {
        try_files $uri /index.html;
    }
}
